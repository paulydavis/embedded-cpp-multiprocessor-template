name: host

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build clang-format
      - name: Build and test
        run: ./scripts/run_tests.sh
      - name: Formatting
        run: ./scripts/format.sh --check
      - name: Lint
        run: ./scripts/lint.sh
