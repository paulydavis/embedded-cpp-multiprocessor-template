name: review

on:
  pull_request:

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check review contract
        run: |
          test -f CLAUDE.md
          grep -q "failing test" CLAUDE.md
          grep -q "Unity" README.md
          grep -q "CMake" README.md
          if git diff --name-only origin/main...HEAD | grep -E '(^|/)(Package.swift|Sources/LiveAstro|Tests/LiveAstro)'; then
            echo "Swift scaffold files are not allowed" >&2
            exit 1
          fi
